services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=512m
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-clerk}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      DATABASE_URL: postgres://aninexus:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/aninexus
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-10}
      SESSION_CACHE_SECONDS: ${SESSION_CACHE_SECONDS:-30}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      IP_HASH_SALT: ${IP_HASH_SALT:?defina IP_HASH_SALT no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PG_POOL_MIN: ${PG_POOL_MIN:-0}
      PG_POOL_MAX: ${PG_POOL_MAX:-30}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-9000}
      PERSIST_MEDIA_CACHE: ${PERSIST_MEDIA_CACHE:-true}
      ANALYTICS_MAX_QUEUE: ${ANALYTICS_MAX_QUEUE:-10000}
      ANALYTICS_FLUSH_MS: ${ANALYTICS_FLUSH_MS:-1000}
      ANALYTICS_BATCH_SIZE: ${ANALYTICS_BATCH_SIZE:-500}
      ANALYTICS_SAMPLE_RATE: ${ANALYTICS_SAMPLE_RATE:-1}
      NEWS_WORKER_INTERVAL_MS: ${NEWS_WORKER_INTERVAL_MS:-300000}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-7}
      NEWS_STALE_GRACE_DAYS: ${NEWS_STALE_GRACE_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  news-worker:
    build: .
    restart: unless-stopped
    init: true
    command: ["pnpm","run","worker:news"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aninexus:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/aninexus
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?defina IP_HASH_SALT no .env}
      PG_POOL_MIN: ${PG_POOL_MIN:-0}
      PG_POOL_MAX: ${NEWS_PG_POOL_MAX:-5}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-9000}
      NEWS_WORKER_INTERVAL_MS: ${NEWS_WORKER_INTERVAL_MS:-300000}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-7}
      NEWS_STALE_GRACE_DAYS: ${NEWS_STALE_GRACE_DAYS:-14}
      NEWS_MAX_PER_SOURCE: ${NEWS_MAX_PER_SOURCE:-45}
      NEWS_MAX_STORIES: ${NEWS_MAX_STORIES:-60}
      NEWS_MAX_SOURCE_AGE_HOURS: ${NEWS_MAX_SOURCE_AGE_HOURS:-168}
      NEWS_MIN_QUALITY: ${NEWS_MIN_QUALITY:-0.50}
      NEWS_TRANSLATE_ENDPOINT: ${NEWS_TRANSLATE_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aninexus
      POSTGRES_USER: aninexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aninexus -d aninexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    command: ["sh","-ec","exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000 --tcp-keepalive 60 --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  postgres_data:
  redis_data:
