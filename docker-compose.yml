services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DATABASE_URL: postgres://aninexus:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/aninexus
      REDIS_URL: redis://redis:6379
      SESSION_DAYS: ${SESSION_DAYS:-30}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-10}
      IP_HASH_SALT: ${IP_HASH_SALT:?defina IP_HASH_SALT no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PG_POOL_MAX: ${PG_POOL_MAX:-30}
      NEWS_WORKER_INTERVAL_MS: ${NEWS_WORKER_INTERVAL_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  news-worker:
    build: .
    restart: unless-stopped
    command: ["npm","run","worker:news"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aninexus:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/aninexus
      REDIS_URL: redis://redis:6379
      IP_HASH_SALT: ${IP_HASH_SALT:?defina IP_HASH_SALT no .env}
      PG_POOL_MAX: ${NEWS_PG_POOL_MAX:-5}
      NEWS_WORKER_INTERVAL_MS: ${NEWS_WORKER_INTERVAL_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aninexus
      POSTGRES_USER: aninexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aninexus -d aninexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","allkeys-lru","--save","60","1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
