limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=8r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
proxy_cache_path /var/cache/nginx/aninexus levels=1:2 keys_zone=aninexus_public:50m max_size=512m inactive=15m use_temp_path=off;

upstream aninexus_app {
  server app:3000;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name aninexus.com.br _;
  server_tokens off;
  client_max_body_size 1m;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  limit_conn conn_limit 50;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location /assets/ {
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering on;
    add_header Cache-Control "public, max-age=604800, immutable" always;
  }

  # Versioned frontend layers never need to wake the Node process repeatedly.
  location ~ ^/(preview-v[0-9]+|data)/ {
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache aninexus_public;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header X-AniNexus-Cache $upstream_cache_status always;
  }

  location ^~ /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering on;
  }

  # Cache only anonymous/public read models. Personal/community writes never enter this location.
  location ~ ^/api/(home|catalog|reading|characters/ranking|schedule|studios|dublados|lists|list/[^/]+|news(?:/[^/]+)?|anime/[0-9]+(?:/themes)?|manga/[0-9]+|media/summaries|users/[^/]+|community/(?:impressions|activity|threads))$ {
    limit_req zone=api_limit burst=80 nodelay;
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_buffering on;

    proxy_cache aninexus_public;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 20s;
    proxy_cache_valid 404 5s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    add_header X-AniNexus-Cache $upstream_cache_status always;
  }

  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering on;
  }

  location / {
    proxy_pass http://aninexus_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_buffering on;
  }
}

server {
  listen 80;
  server_name www.aninexus.com.br;
  return 308 https://aninexus.com.br$request_uri;
}
