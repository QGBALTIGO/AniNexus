name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'scripts/update-news.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: aninexus-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar fontes editoriais
        run: node scripts/update-news.mjs
      - name: Publicar feed local
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças no feed."
            exit 0
          fi
          git config user.name "AniNexus News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: atualizar notícias [skip ci]"
          git push
