name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - 'scripts/update-news-v36.mjs'
      - 'lib/news-sources-v36.mjs'
      - 'lib/news-sources-v34.mjs'
      - 'lib/news-core.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: aninexus-news-v36
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar coletor V36
        run: |
          node --check lib/news-sources-v36.mjs
          node --check scripts/update-news-v36.mjs
      - name: Buscar e aprofundar JBox, Crunchyroll e fontes complementares
        env:
          NEWS_RETENTION_DAYS: '7'
          NEWS_MAX_SOURCE_AGE_HOURS: '168'
          NEWS_MAX_PER_SOURCE: '45'
          NEWS_MAX_STORIES: '60'
          NEWS_STATIC_MAX_ITEMS: '60'
          NEWS_MIN_SAFE_FEED: '10'
          NEWS_MIN_QUALITY: '0.50'
        run: node scripts/update-news-v36.mjs
      - name: Validar feed editorial
        run: node tests/news-system.mjs
      - name: Publicar feed interno
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças no feed."
            exit 0
          fi
          git config user.name "AniNexus News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: atualizar notícias V36 [skip ci]"
          git push
