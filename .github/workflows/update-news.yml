name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - 'scripts/update-news-v36.mjs'
      - 'lib/news-rich-v37.mjs'
      - 'lib/news-sources-v36.mjs'
      - 'lib/news-sources-v36-normalized.mjs'
      - 'lib/news-sources-v34.mjs'
      - 'lib/news-worker-v37.mjs'
      - 'lib/news-core.mjs'
      - 'preview-v35/news-data-v35.js'
      - 'preview-v37/news-hot-v37.js'
      - 'preview-v35/news-ui-v35.js'
      - 'preview-v36/news-v36.css'
      - 'data/news-v37-hot.json'
      - 'data/news-v36-seed.json'
      - 'tests/news-system.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: aninexus-news-v39
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar coletor, mídia e worker
        run: |
          node --check lib/news-sources-v36.mjs
          node --check lib/news-sources-v36-normalized.mjs
          node --check lib/news-rich-v37.mjs
          node --check scripts/update-news-v36.mjs
          node --check lib/news-worker-v37.mjs
          node --check preview-v35/news-data-v35.js
          node --check preview-v37/news-hot-v37.js
          node --check preview-v35/news-ui-v35.js

      - name: Buscar, aprofundar e capturar mídia
        env:
          NEWS_RETENTION_DAYS: '7'
          NEWS_STALE_GRACE_DAYS: '14'
          NEWS_MAX_SOURCE_AGE_HOURS: '168'
          NEWS_MAX_PER_SOURCE: '45'
          NEWS_MAX_STORIES: '60'
          NEWS_STATIC_MAX_ITEMS: '60'
          NEWS_MIN_SAFE_FEED: '10'
          NEWS_MIN_QUALITY: '0.50'
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "Coleta de notícias — tentativa ${attempt}/3"
            if node scripts/update-news-v36.mjs; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 8))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "A coleta falhou após 3 tentativas."
            exit 1
          fi

      - name: Validar somente o feed editorial
        run: node tests/news-system.mjs

      - name: Publicar feed interno
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças no feed."
            exit 0
          fi

          git config user.name "AniNexus News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: atualizar notícias V39 [skip ci]"

          for attempt in 1 2 3; do
            echo "Publicação do feed — tentativa ${attempt}/3"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "A main mudou durante a coleta; atualizando a base antes de tentar novamente."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Não foi possível reaplicar o feed sobre a main atual."
              exit 1
            fi
            sleep $((attempt * 5))
          done

          echo "Não foi possível publicar o feed após 3 tentativas."
          exit 1
