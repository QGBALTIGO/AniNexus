name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update-news-v34.mjs'
      - 'lib/news-sources-v34.mjs'
      - 'lib/news-core.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: aninexus-news-v34
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar coletor
        run: |
          node --check lib/news-sources-v34.mjs
          node --check scripts/update-news-v34.mjs
      - name: Buscar, enriquecer e localizar matérias
        env:
          NEWS_RETENTION_DAYS: '5'
          NEWS_MAX_SOURCE_AGE_HOURS: '120'
          NEWS_MIN_QUALITY: '0.52'
        run: node scripts/update-news-v34.mjs
      - name: Validar feed
        run: node tests/news-system.mjs
      - name: Publicar feed local
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sem mudanças no feed."
            exit 0
          fi
          git config user.name "AniNexus News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: atualizar notícias V34 [skip ci]"
          git push
