name: Deploy AniNexus no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aninexus-github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validar código e contratos
        run: pnpm run check

      - name: Montar publicação segura
        env:
          NODE_ENV: production
          PUBLIC_SITE_ORIGIN: https://qgbaltigo.github.io/AniNexus
          PUBLIC_BASE_PATH: /AniNexus/
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_AUTH_ENABLED: ${{ vars.PUBLIC_AUTH_ENABLED || 'false' }}
        run: |
          pnpm run build:public
          pnpm run validate:deploy

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar sem alterar DNS
        id: deployment
        uses: actions/deploy-pages@v4
