name: AniNexus quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Syntax and contract smoke tests
        run: npm run check
      - name: Critical dependency audit
        run: npm audit --omit=dev --audit-level=critical

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Map GitHub Pages hostname locally
        run: echo "127.0.0.1 qgbaltigo.github.io" | sudo tee -a /etc/hosts
      - name: Browser E2E — desktop and mobile
        env:
          ANINEXUS_E2E_ORIGIN: http://qgbaltigo.github.io:4173/AniNexus/
        run: |
          rm -rf /tmp/aninexus-e2e-root
          mkdir -p /tmp/aninexus-e2e-root/AniNexus
          rsync -a --exclude '.git' --exclude 'node_modules' ./ /tmp/aninexus-e2e-root/AniNexus/
          # Production keeps upgrade-insecure-requests. The local test server is
          # intentionally HTTP, so remove only this directive in the temp copy.
          sed -i 's/; upgrade-insecure-requests//' /tmp/aninexus-e2e-root/AniNexus/index.html
          (cd /tmp/aninexus-e2e-root && python3 -m http.server 4173 > /tmp/aninexus-http.log 2>&1) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --noproxy '*' -fsS http://qgbaltigo.github.io:4173/AniNexus/ >/dev/null; then break; fi
            if [ "$i" = "20" ]; then cat /tmp/aninexus-http.log; exit 1; fi
            sleep 1
          done
          npx playwright test tests/e2e.spec.mjs --reporter=line --timeout=60000 --retries=1
      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/aninexus-http.log || true
