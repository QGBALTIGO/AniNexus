name: AniNexus quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Syntax and contract smoke tests
        run: npm run check
      - name: Critical dependency audit
        run: npm audit --omit=dev --audit-level=critical

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Map GitHub Pages hostname locally
        run: echo "127.0.0.1 qgbaltigo.github.io" | sudo tee -a /etc/hosts
      - name: Start static preview with GitHub Pages path semantics
        run: |
          cd ..
          python3 -m http.server 4173 > /tmp/aninexus-http.log 2>&1 &
          echo $! > /tmp/aninexus-http.pid
          for i in {1..20}; do
            if curl -fsS http://qgbaltigo.github.io:4173/AniNexus/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aninexus-http.log
          exit 1
      - name: Browser E2E — desktop and mobile
        env:
          ANINEXUS_E2E_ORIGIN: http://qgbaltigo.github.io:4173/AniNexus/
        run: npx playwright test tests/e2e.spec.mjs --project=chromium --reporter=line
      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/aninexus-http.log || true
