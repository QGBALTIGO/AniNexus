limit_req_zone $binary_remote_addr zone=aninexus_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=aninexus_auth:10m rate=8r/m;
limit_conn_zone $binary_remote_addr zone=aninexus_conn:10m;

upstream aninexus_api_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aninexus-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Local-only checks keep atomic deploys independent from redirects and TLS.
    location = /release.json {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /var/www/aninexus/current;
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /var/www/aninexus/current;
        expires epoch;
        try_files $uri =404;
    }
    location = /assets/favicon.png {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /var/www/aninexus/current;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/187.77.255.164/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187.77.255.164/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ANINEXUS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/aninexus/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;
    client_max_body_size 1m;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    limit_conn aninexus_conn 50;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ^~ /api/auth/ {
        limit_req zone=aninexus_auth burst=5 nodelay;
        proxy_pass http://aninexus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location ~ ^/api/(catalog|reading|schedule|studios|dublados|lists|list/[^/]+|news(?:/[^/]+)?|anime/[0-9]+|manga/[0-9]+|community/impressions)$ {
        limit_req zone=aninexus_api burst=80 nodelay;
        proxy_pass http://aninexus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
    }

    location /api/ {
        limit_req zone=aninexus_api burst=50 nodelay;
        proxy_pass http://aninexus_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location = /health {
        proxy_pass http://aninexus_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health/ready {
        proxy_pass http://aninexus_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        expires epoch;
        try_files $uri =404;
    }
    location = /release.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }
    location = /runtime-config.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|map|json)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
