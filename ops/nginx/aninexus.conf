server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/aninexus/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;

    # The public test endpoint is temporarily HTTP-only. Remove only this CSP
    # directive from HTML responses so browsers do not upgrade the IP to HTTPS.
    sub_filter_once on;
    sub_filter '; upgrade-insecure-requests' '';

    location = /index.html {
        expires epoch;
        try_files $uri =404;
    }

    location = /release.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|map|json)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
