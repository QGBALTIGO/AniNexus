server {
    listen 80;
    listen [::]:80;
    server_name aninexus.com.br www.aninexus.com.br;

    root /var/www/aninexus/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aninexus-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /index.html {
        expires epoch;
        try_files $uri =404;
    }
    location = /release.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }
    location = /runtime-config.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|map|json)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
